name: Run quality checks
run-name: ${{ github.actor }} triggered quality check pipeline
on:
  push:

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "${{ vars.NODE_VERSION }}"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Run ESLint
        run: npm run lint

      - name: Restore Jest cache
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'jest.config.ts', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'jest.config.ts', 'tsconfig*.json') }}-
            jest-${{ runner.os }}-

      - name: Run tests
        run: npm test -- --ci

  build:
    name: Build app
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "${{ vars.NODE_VERSION }}"
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - run: npm run build
